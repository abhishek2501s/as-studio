<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AS STUDIO | Premium Wear</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: #0b0b0b; color: #fff; padding-bottom: 70px; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 18px 6%; background: #121212; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
    .logo { font-size: 20px; font-weight: 700; letter-spacing: 3px; color: #fff; }
    .nav-links { list-style: none; display: flex; gap: 15px; }
    .nav-links a { color: #888; text-decoration: none; font-size: 13px; font-weight: 500; }
    
    .hero { height: 45vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1000&q=80') center/cover; padding: 0 20px; }
    .hero h1 { font-size: 28px; letter-spacing: 2px; margin-bottom: 8px; }
    .hero p { color: #aaa; font-size: 14px; }
    
    .products { padding: 35px 6%; }
    .products h2 { font-size: 22px; margin-bottom: 25px; text-align: center; letter-spacing: 1.5px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .product-card { background: #161616; padding: 14px; border-radius: 10px; border: 1px solid #242424; }
    .product-card img { width: 100%; height: 260px; object-fit: cover; border-radius: 8px; }
    .product-card h3 { font-size: 15px; margin: 12px 0 4px; color: #eee; }
    .price { font-size: 16px; font-weight: 600; color: #25D366; margin-bottom: 12px; }
    
    .btn-group { display: flex; gap: 8px; }
    .btn-cart { flex: 1; background: #222; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; }
    .btn-cart:hover { background: #333; }
    .btn-buy { flex: 1; background: #25D366; color: #fff; text-align: center; text-decoration: none; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 12px; }
    
    /* Floating Cart Bar */
    .cart-float { position: fixed; bottom: 15px; left: 5%; right: 5%; max-width: 400px; margin: 0 auto; background: #1f1f1f; border: 1px solid #333; padding: 12px 18px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 25px rgba(0,0,0,0.7); z-index: 999; }
    .cart-info { font-size: 13px; font-weight: 600; }
    .cart-checkout-btn { background: #25D366; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }

    footer { text-align: center; padding: 25px 20px; background: #121212; color: #666; font-size: 12px; border-top: 1px solid #222; margin-top: 40px; }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">AS STUDIO</div>
      <ul class="nav-links">
        <li><a href="#collection">Collection</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <h1>NEW DROP</h1>
    <p>Premium oversized streetwear & tailored fits</p>
  </section>

  <section id="collection" class="products">
    <h2>Featured Collection</h2>
    <div class="product-grid">

      <!-- Product 1 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80" alt="Oversized Hoodie">
        <h3>Oversized Black Hoodie</h3>
        <p class="price">₹1,499</p>
        <div class="btn-group">
          <button class="btn-cart" onclick="addToCart('Oversized Black Hoodie', 1499)">+ Add to Cart</button>
          <a class="btn-buy" href="https://wa.me/918447311105?text=Hi%20AS%20Studio,%20I%20want%20to%20buy%20the%20Oversized%20Black%20Hoodie" target="_blank">Buy Now</a>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1520975954732-35dd22299614?auto=format&fit=crop&w=600&q=80" alt="Suede Jacket">
        <h3>Brown Suede Jacket</h3>
        <p class="price">₹2,999</p>
        <div class="btn-group">
          <button class="btn-cart" onclick="addToCart('Brown Suede Jacket', 2999)">+ Add to Cart</button>
          <a class="btn-buy" href="https://wa.me/918447311105?text=Hi%20AS%20Studio,%20I%20want%20to%20buy%20the%20Brown%20Suede%20Jacket" target="_blank">Buy Now</a>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80" alt="White Tee">
        <h3>Heavyweight White Tee</h3>
        <p class="price">₹799</p>
        <div class="btn-group">
          <button class="btn-cart" onclick="addToCart('Heavyweight White Tee', 799)">+ Add to Cart</button>
          <a class="btn-buy" href="https://wa.me/918447311105?text=Hi%20AS%20Studio,%20I%20want%20to%20buy%20the%20Heavyweight%20White%20Tee" target="_blank">Buy Now</a>
        </div>
      </div>

    </div>
  </section>

  <!-- Floating Cart Bar -->
  <div id="cartBar" class="cart-float" style="display: none;">
    <div class="cart-info" id="cartCount">0 Items | ₹0</div>
    <button class="cart-checkout-btn" onclick="checkoutCart()">Order Cart (WhatsApp)</button>
  </div>

  <footer>
    <p>© 2026 AS STUDIO. All rights reserved.</p>
  </footer>

  <script>
    let myCart = [];

    function addToCart(name, price) {
      myCart.push({ name: name, price: price });
      updateCartDisplay();
    }

    function updateCartDisplay() {
      let bar = document.getElementById('cartBar');
      let countText = document.getElementById('cartCount');
      if (myCart.length > 0) {
        bar.style.display = 'flex';
        let total = myCart.reduce((sum, item) => sum + item.price, 0);
        countText.innerText = myCart.length + " Items | ₹" + total;
      }
    }

    function checkoutCart() {
      if (myCart.length === 0) return;
      let total = myCart.reduce((sum, item) => sum + item.price, 0);
      let itemsList = myCart.map(i => i.name + " (₹" + i.price + ")").join(", ");
      let msg = "Hi AS Studio, I want to order the following items from my cart:\n\n" + itemsList + "\n\n*Total Amount:* ₹" + total;
      window.open("https://wa.me/918447311105?text=" + encodeURIComponent(msg), "_blank");
    }
  </script>

</body>
</html>
